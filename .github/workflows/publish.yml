# Conventional commits on main accumulate into a Release PR that maintains
# CHANGELOG.md and the package version. Merging that PR cuts the tag and the
# GitHub Release, and publishes to npm in the SAME run — a GITHUB_TOKEN-created
# release event cannot trigger a separate workflow, so `on: release: published`
# would never fire.
#
# main only receives commits via a develop -> main PR (develop is where work
# actually lands first); that merge is what cuts a release here.
#
# Both jobs live in this one file on purpose. npm's trusted publisher is pinned
# to the workflow filename, and for OIDC npm reads the TOP-LEVEL workflow of the
# run. Splitting the publish half into its own file — even called via `uses:` —
# would make npm see the caller instead and refuse the publish.
#
# There is deliberately no NPM_TOKEN. Trusted Publishing mints a short-lived
# OIDC token for this exact workflow in this exact repository, so nothing
# long-lived exists to leak or rotate — and npm is restricting the bypass-2FA
# tokens that were the only other way to publish unattended.
#
# One-time setup on npmjs.com, which cannot be done from here:
#   create-ai-memory → Settings → Trusted Publisher → GitHub Actions
#   organization: rambaarde   repository: create-ai-memory   workflow: publish.yml
#
# That trust is pinned to the REPOSITORY NAME. Renaming rambaarde/create-ai-memory
# breaks publishing until the trusted publisher is updated to match — and so
# does package.json's repository.url, which provenance checks below.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish the current package.json version even when release-please did not create a new release.
        required: false
        default: "false"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_publish == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to mint the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 to perform the OIDC exchange at
      # all. Node 22 bundles npm 10, which simply publishes with whatever token
      # it can find — and with no token configured, the registry answers a 404
      # on the PUT that reads exactly like a missing package rather than a
      # missing credential. This line is the whole difference.
      - run: npm install -g npm@latest

      # This package ships a zsh module and a bash installer; the suite is the
      # only gate that exists. A release with a broken hook or a broken
      # install.sh default is worse than a late one.
      - name: ensure zsh is present
        run: command -v zsh >/dev/null || (sudo apt-get update -y && sudo apt-get install -y --no-install-recommends zsh)
      - run: npm test

      # A proxy for "the tool ships" is not the same as the tool shipping.
      # Assert on the actual tarball: every entry point must be in it, and
      # nothing that only belongs in the repository may be.
      - name: assert the tarball before it leaves
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            // npm 12 changed this from an array to an object keyed by package
            // name, and the step above installs whatever npm is current.
            const raw = require("/tmp/pack.json");
            const meta = Array.isArray(raw) ? raw[0] : Object.values(raw)[0];
            if (!meta || !Array.isArray(meta.files)) {
              console.error("unrecognised npm pack --json shape: " + JSON.stringify(Object.keys(raw)));
              process.exit(1);
            }
            const files = meta.files.map((f) => f.path);
            const fail = (m) => { console.error("REFUSING TO PUBLISH: " + m); process.exit(1); };
            const pkg = require("./package.json");
            for (const [name, path] of Object.entries(pkg.bin ?? {})) {
              if (!files.includes(path)) fail(`${path} (bin "${name}") is not in the tarball`);
            }
            for (const dir of ["shell/", "hooks/", "vault-template/"]) {
              if (!files.some((f) => f.startsWith(dir))) fail(`${dir} is not in the tarball`);
            }
            const junk = files.filter((f) =>
              f.startsWith("tests/") || f.startsWith(".github/") || f.startsWith("docs/") ||
              f === "release-please-config.json" || f === ".release-please-manifest.json"
            );
            if (junk.length) fail("must not publish: " + junk.join(", "));
            for (const field of ["dependencies", "optionalDependencies", "peerDependencies"]) {
              if (Object.keys(pkg[field] ?? {}).length) fail(`a ${field} entry appeared`);
            }
            // Provenance is checked by the registry only AFTER the bundle is
            // signed and uploaded, and it reports a mismatch as a 422 that
            // reads like an auth problem. Asking here turns that into a plain
            // sentence, before anything is signed.
            const want = `github.com/${process.env.GITHUB_REPOSITORY}`;
            const url = pkg.repository?.url ?? pkg.repository ?? "";
            if (!url.includes(want)) {
              fail(`repository.url is "${url}" — provenance needs it to name ${want}`);
            }
            console.log(`ok: ${meta.entryCount} files, ${(meta.size / 1024).toFixed(1)}kb, 0 deps`);
          '

      # Provenance requires a PUBLIC source repository — npm rejects the bundle
      # with 422 otherwise, AFTER signing it, so the failure arrives late and
      # reads like an auth problem when it is not.
      - name: publish
        run: npm publish ${{ github.event.repository.private && ' ' || '--provenance' }}

      - name: verify it is actually installable
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          # npm's own notice after a provenance-signed publish: "your package
          # is being processed and may take a few minutes to become
          # available." A short retry budget here reads as a flaky publish
          # when it's really just npm's async attestation pipeline running
          # long -- give it real time before giving up.
          found=0
          for i in $(seq 1 24); do
            npm view "create-ai-memory@$VERSION" version >/dev/null 2>&1 && { found=1; break; }
            echo "waiting for the registry to serve $VERSION ($i/24)"; sleep 20
          done
          if [ "$found" -ne 1 ]; then
            echo "REFUSING: create-ai-memory@$VERSION never became available on the registry after ~8 minutes" >&2
            exit 1
          fi
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "create-ai-memory@$VERSION" --prefer-online
          # install.sh is non-interactive when piped (see its own header
          # comment): closed stdin takes every default and never blocks, so
          # this runs the real installer end to end, not a stand-in for it.
          # Invoke the installed bin directly rather than through npx — npx's
          # temp-install-and-PATH-shim step has proven flaky on the hosted
          # runner even though the identical package installs and runs fine
          # both locally and in a plain Docker container.
          node ./node_modules/create-ai-memory/bin/create-ai-memory.js "$WORK/tool" < /dev/null
          test -f "$WORK/tool/shell/ai-mem.zsh"
          test -f "$WORK/tool/install.sh"
          zsh -c "source \"$WORK/tool/shell/ai-mem.zsh\" && typeset -f claude-start >/dev/null" \
            && echo "ok: create-ai-memory@$VERSION installs and the module sources cleanly"
